<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — KitchenPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf7f2;--green:#4a6741;--green2:#5d7f53;--brown:#7a5c3a;--text:#2c2416;--text2:#5a4a32;--text3:#8a7a62;--tan2:#e4d5bc;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;line-height:1.6}
.brand{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;color:var(--green);margin-bottom:40px;text-decoration:none}
.brand span{color:var(--brown);font-style:italic}
h1{font-family:'Playfair Display',serif;font-size:clamp(64px,12vw,128px);font-weight:600;color:var(--green);line-height:1;letter-spacing:-2px;margin-bottom:8px}
h2{font-family:'Playfair Display',serif;font-size:clamp(24px,3vw,32px);font-weight:600;color:var(--text);margin-bottom:12px}
p{font-size:16px;color:var(--text2);max-width:480px;margin-bottom:28px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;padding:13px 28px;border-radius:8px;font-weight:700;text-decoration:none;font-size:15px;transition:background .2s,transform .1s}
.cta:hover{background:var(--green2);transform:translateY(-1px)}
.links{margin-top:32px;font-size:13px;color:var(--text3)}
.links a{color:var(--text3);text-decoration:none;margin:0 10px;border-bottom:1px solid var(--tan2)}
.links a:hover{color:var(--green)}
</style>
</head>
<body>
  <a href="/" class="brand">Kitchen<span>Pro</span></a>
  <h1>404</h1>
  <h2>We couldn't find that page.</h2>
  <p>The page you're looking for doesn't exist — or it moved to a new home. Head back and we'll get you sorted.</p>
  <a href="/" class="cta">← Back to KitchenPro</a>
  <div class="links">
    <a href="/">Home</a>
    <a href="/app">Sign in</a>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
  </div>
</body>
</html>
